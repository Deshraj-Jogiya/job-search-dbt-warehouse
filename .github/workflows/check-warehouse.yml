name: Check Warehouse Status

on:
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Query the real Databricks SQL warehouse status
        env:
          DATABRICKS_HOST: ${{ secrets.DATABRICKS_HOST }}
          DATABRICKS_TOKEN: ${{ secrets.DATABRICKS_TOKEN }}
        run: |
          HOST_CLEAN=$(echo "$DATABRICKS_HOST" | sed -e 's#^https\?://##' -e 's#/$##')
          curl -sf -H "Authorization: Bearer $DATABRICKS_TOKEN" \
            "https://$HOST_CLEAN/api/2.0/sql/warehouses" | python3 -m json.tool
