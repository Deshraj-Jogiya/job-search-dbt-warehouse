job_search_dbt_warehouse:
  target: dev
  outputs:
    dev:
      type: databricks
      catalog: workspace
      schema: "{{ env_var('DBT_SCHEMA', 'job_search_dbt') }}"
      host: "{{ env_var('DATABRICKS_HOST') }}"
      http_path: "{{ env_var('DATABRICKS_HTTP_PATH') }}"
      token: "{{ env_var('DATABRICKS_TOKEN') }}"
      threads: 2
